<!doctype html>
<!--
  SR Agent fixture — CLEAN. The counterpart to broken-login.html, same shape, no defects.
  Consumed by BstackAIAutomation weba11y_sr_agent_scan.feature (@sr-agent-a11y-scan-clean).

    * descriptive <title>                     -> no PAGE_TITLE
    * skip link, first in tab order, to <main> -> no SKIP_LINK
    * the button has a real accessible name    -> no MISSING_LABEL
    * DOM order only, no positive tabindex     -> no BROKEN_FOCUS_ORDER
    * result announced via role="status"       -> nothing silent

  DELIBERATELY MINIMAL, and for the same reason as the defective page: one control, one
  interaction, no form and no typing. The fewer turns the agent takes, the more likely the
  scan finalizes and this page's zero-violation claim is actually tested.

  Keep this page accessible. A finding here reads as a product regression, which is exactly
  what the scenario is for.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show Message - SR Agent Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    button { font-size: 1.25rem; padding: 0.6rem 1.2rem; }
    /* Off-screen until focused, so it is reachable and announced rather than hidden. */
    .skip { position: absolute; left: -9999px; }
    .skip:focus { position: static; left: auto; display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <main id="main">
    <h1>Show Message</h1>

    <button id="action" type="button" onclick="run()">Show message</button>

    <p id="result" role="status"></p>
  </main>

  <script>
    function run() {
      document.getElementById('result').textContent = 'Done.';
    }
  </script>
</body>
</html>
