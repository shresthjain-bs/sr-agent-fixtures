<!doctype html>
<!--
  SR Agent fixture — DEFECTIVE. Pinned defect set; do not "fix" the a11y here.
  Consumed by BstackAIAutomation weba11y_sr_agent_scan.feature (@sr-agent-a11y-scan-violations).

    1. blank <title>       -> PAGE_TITLE    (page-load audit, WCAG 2.4.2)
    2. no skip link        -> SKIP_LINK     (page-load audit, WCAG 2.4.1)
    3. icon-only <button>  -> MISSING_LABEL (traversal, WCAG 4.1.2/1.1.1/2.4.6)

  DELIBERATELY MINIMAL. One control, one interaction, no form and no typing.
  An earlier revision was a two-field login form; the agent never finished it — it could not
  move focus out of the browser address bar and burned all 900 actions
  (MAX_TOTAL_ACTIONS) without producing a report. The fewer turns the agent has to take,
  the more likely the scan reaches finalize and the report contract actually gets tested.
  Keep this page to a single button. Add complexity only once the agent is reliable.

  Defects 1 and 2 need no traversal and no LLM at all — the page-load audit runs
  unconditionally between navigate and parse-workflow — so the test pins those hardest.
  Defect 3 needs the agent to land on the button.

  The button keeps an id so automation can target it. An accessibility defect is not an
  automation blocker: what makes it inaccessible is having no accessible name, so a screen
  reader announces a bare "button".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DEFECT 1: blank title. -->
  <title> </title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    button { font-size: 1.25rem; padding: 0.6rem 1.2rem; }
  </style>
</head>
<body>
  <!-- DEFECT 2: no skip link, no landmark. -->
  <p>Demo</p>

  <!-- DEFECT 3: icon-only button, no accessible name. Announced as just "button". -->
  <button id="action" onclick="run()">&#10148;</button>

  <p id="result" role="status"></p>

  <script>
    function run() {
      document.getElementById('result').textContent = 'Done.';
    }
  </script>
</body>
</html>
