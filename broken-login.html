<!doctype html>
<!--
  SR Agent fixture — DEFECTIVE. Pinned defect set; do not "fix" the a11y here.
  Consumed by BstackAIAutomation api/src/features/a11y/weba11y_sr_agent_scan.feature
  (@sr-agent-a11y-scan-violations). Each defect below maps to a report violationType.

    1. blank <title>                  -> PAGE_TITLE      (page-load audit, WCAG 2.4.2)
    2. no skip link                   -> SKIP_LINK       (page-load audit, WCAG 2.4.1)
    3. icon-only <button>             -> MISSING_LABEL   (traversal, WCAG 4.1.2/1.1.1/2.4.6)
    4. unlabelled <input>s            -> MISSING_LABEL
    5. scrambled positive tabindex    -> BROKEN_FOCUS_ORDER (LLM-judged, WCAG 2.4.3/1.3.2)

  1 and 2 need no traversal, so they are the assertions the test pins hardest.
  3 and 4 need the agent to tab onto the control; 5 needs >= 10 navigation events.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DEFECT 1: blank title. NVDA announces nothing descriptive. -->
  <title> </title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    .row { margin: 0.75rem 0; }
    .icon-btn { font-size: 1.1rem; padding: 0.4rem 0.7rem; }
    input { padding: 0.4rem; }
  </style>
</head>
<body>
  <!-- DEFECT 2: no skip link, and no landmark to skip to. -->
  <div>Store</div>

  <div>
    <!-- DEFECT 5: positive tabindex scrambles order away from DOM order. -->
    <a href="#offers" tabindex="3">Offers</a>
    <a href="#orders" tabindex="1">Orders</a>
    <a href="#favourites" tabindex="2">Favourites</a>
  </div>

  <div>Sign in</div>

  <form id="signin" onsubmit="return submitForm(event)">
    <div class="row">
      <!-- DEFECT 4: no label, no aria-label, no placeholder. Announced as "edit". -->
      <input id="u" type="text" tabindex="5">
    </div>
    <div class="row">
      <!-- DEFECT 4: same for the password field. -->
      <input id="p" type="password" tabindex="4">
    </div>
    <div class="row">
      <!-- DEFECT 3: icon-only button. Announced as "button" with no purpose. -->
      <button class="icon-btn" type="submit" tabindex="6">&#10148;</button>
    </div>
  </form>

  <div id="result" role="status"></div>

  <script>
    function submitForm(e) {
      e.preventDefault();
      // No error announcement either — deliberate, so FORM_ERROR can be added later.
      document.getElementById('result').textContent = '';
      return false;
    }
  </script>
</body>
</html>
