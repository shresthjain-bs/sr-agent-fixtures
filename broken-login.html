<!doctype html>
<!--
  SR Agent fixture — DEFECTIVE. Pinned defect set; do not "fix" the a11y here.
  Consumed by BstackAIAutomation api/src/features/a11y/weba11y_sr_agent_scan.feature
  (@sr-agent-a11y-scan-violations).

    1. blank <title>              -> PAGE_TITLE    (page-load audit, WCAG 2.4.2)
    2. no skip link, no landmarks -> SKIP_LINK     (page-load audit, WCAG 2.4.1)
    3. unlabelled <input>s        -> MISSING_LABEL (traversal, WCAG 4.1.2/1.1.1/2.4.6)
    4. icon-only <button>         -> MISSING_LABEL (traversal)

  1 and 2 need no traversal and no LLM, so the test pins those hardest.
  3 and 4 need the agent to tab onto the control.

  IMPORTANT — an accessibility defect is not an automation blocker.
  Every control keeps a name/id an automation tool can target. A real unlabelled input
  still has name="username"; what makes it inaccessible is the absence of a <label>,
  aria-label or any accessible name, so NVDA announces "edit" with no purpose. An earlier
  revision stripped the name/id too, which made the form unreachable: the agent looped on
  fallback clicks (input[name='username'], input#username, input[placeholder*='user'])
  until it exhausted its action budget, and never produced a usable report. Keep these
  attributes.

  Also deliberately absent: positive tabindex. Scrambling the tab order fought the agent
  for control of traversal and cost more than the BROKEN_FOCUS_ORDER finding was worth.
  A focus-order fixture belongs in its own page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DEFECT 1: blank title. Nothing descriptive is announced. -->
  <title> </title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    .row { margin: 0.75rem 0; }
    .icon-btn { font-size: 1.1rem; padding: 0.4rem 0.9rem; }
    input { padding: 0.4rem; width: 18rem; }
  </style>
</head>
<body>
  <!-- DEFECT 2: no skip link, and no <nav>/<main> landmark to skip to. -->
  <div>Store</div>

  <div>
    <a href="#offers">Offers</a>
    <a href="#orders">Orders</a>
    <a href="#favourites">Favourites</a>
  </div>

  <div>Sign in</div>

  <form id="signin" onsubmit="return submitForm(event)">
    <div class="row">
      <!-- DEFECT 3: no <label>, no aria-label, no placeholder, no title.
           Findable by automation (name/id), announced as a bare "edit" by NVDA. -->
      <input id="username" name="username" type="text" autocomplete="off">
    </div>
    <div class="row">
      <!-- DEFECT 3: same for the password field. -->
      <input id="password" name="password" type="password" autocomplete="off">
    </div>
    <div class="row">
      <!-- DEFECT 4: icon-only submit. Announced as "button" with no purpose.
           Still targetable as button[type='submit'] / #submit. -->
      <button id="submit" class="icon-btn" type="submit">&#10148;</button>
    </div>
  </form>

  <div id="result" role="status"></div>

  <script>
    function submitForm(e) {
      e.preventDefault();
      var u = document.getElementById('username');
      var out = document.getElementById('result');
      // Announced on success so the workflow can complete and the scan can finalize.
      out.textContent = u.value ? ('Signed in as ' + u.value + '.') : 'Signed in.';
      return false;
    }
  </script>
</body>
</html>
